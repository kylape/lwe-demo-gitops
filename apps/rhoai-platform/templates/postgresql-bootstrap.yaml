apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-bootstrap
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgresql-bootstrap
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgresql-bootstrap
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
subjects:
  - kind: ServiceAccount
    name: postgresql-bootstrap
    namespace: postgresql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgresql-bootstrap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-bootstrap
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
data:
  bootstrap-postgresql.sh: |
{{ .Files.Get "files/bootstrap-postgresql.sh" | indent 4 }}
  init-postgresql-databases.sh: |
{{ .Files.Get "files/init-postgresql-databases.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-secret-bootstrap
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: postgresql-bootstrap
      containers:
        - name: bootstrap
          image: {{ .Values.images.cli | quote }}
          command: ["/bin/bash", "/scripts/bootstrap-postgresql.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: postgresql-bootstrap
            defaultMode: 0550
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-database-bootstrap
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: postgresql-bootstrap
      containers:
        - name: initialize-databases
          image: {{ .Values.images.postgresql | quote }}
          command: ["/bin/bash", "/scripts/init-postgresql-databases.sh"]
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: username
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: admin-password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: postgresql-bootstrap
            defaultMode: 0550
