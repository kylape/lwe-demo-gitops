apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: psql-keycloak-pvc
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.postgresql }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psql-keycloak
  namespace: postgresql
  labels:
    app: psql-keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: psql-keycloak
  template:
    metadata:
      labels:
        app: psql-keycloak
        name: psql-keycloak
    spec:
      initContainers:
        - name: fix-permissions
          image: {{ .Values.images.postgresql | quote }}
          command:
            - /bin/sh
            - -c
            - |
              bootstrap_dir() {
                if [ -e "$1" ] && [ ! -d "$1" ]; then
                  mv "$1" "$1.stale.$(date +%s)"
                elif [ -d "$1" ] && { [ ! -r "$1" ] || [ ! -w "$1" ] || [ ! -x "$1" ]; }; then
                  mv "$1" "$1.stale.$(date +%s)"
                fi
                mkdir -p "$1"
              }
              bootstrap_dir /var/lib/pgsql/data
              bootstrap_dir /var/lib/pgsql/data/userdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      containers:
        - name: postgresql
          image: {{ .Values.images.postgresql | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: database
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: admin-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -h 127.0.0.1 -p 5432"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -h 127.0.0.1 -p 5432"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: psql-keycloak-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: psql-keycloak
  namespace: postgresql
spec:
  selector:
    app: psql-keycloak
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
