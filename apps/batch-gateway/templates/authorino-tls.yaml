apiVersion: v1
kind: Service
metadata:
  name: authorino-authorino-authorization
  namespace: kuadrant-system
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: authorino-server-cert
    argocd.argoproj.io/sync-wave: "20"
---
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: authorino
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  listener:
    tls:
      enabled: true
      certSecretRef:
        name: authorino-server-cert
  volumes:
    items:
      - name: service-ca-bundle
        mountPath: /etc/ssl/certs/openshift-service-ca
        configMaps:
          - openshift-service-ca.crt
        items:
          - key: service-ca.crt
            path: service-ca-bundle.crt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authorino-tls-bootstrap
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "22"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authorino-tls-bootstrap
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "22"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authorino-server-cert"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["authorino"]
    verbs: ["get", "patch", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authorino-tls-bootstrap
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "22"
subjects:
  - kind: ServiceAccount
    name: authorino-tls-bootstrap
    namespace: kuadrant-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authorino-tls-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authorino-tls-bootstrap
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "25"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: authorino-tls-bootstrap
      containers:
        - name: configure-ca-trust
          image: {{ .Values.images.cli | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              attempt=0
              until kubectl get secret authorino-server-cert -n kuadrant-system >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "timed out waiting for the Authorino serving certificate" >&2
                  exit 1
                fi
                sleep 5
              done
              kubectl set env deployment/authorino -n kuadrant-system \
                SSL_CERT_FILE=/etc/ssl/certs/openshift-service-ca/service-ca-bundle.crt \
                REQUESTS_CA_BUNDLE=/etc/ssl/certs/openshift-service-ca/service-ca-bundle.crt
              kubectl rollout status deployment/authorino -n kuadrant-system --timeout=180s
