apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: kuadrant-operator-group
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  channel: {{ .Values.operators.rhclChannel | quote }}
  installPlanApproval: Automatic
  name: rhcl-operator
  source: {{ .Values.operators.catalogSource | quote }}
  sourceNamespace: {{ .Values.operators.sourceNamespace | quote }}
---
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec: {}
