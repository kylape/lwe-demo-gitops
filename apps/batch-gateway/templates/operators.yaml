apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: redhat-ods-operator
  namespace: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: {{ .Values.rhoai.catalogSource }}
  namespace: openshift-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  sourceType: grpc
  image: {{ .Values.rhoai.catalogImage | quote }}
  displayName: RHOAI Catalog
  publisher: Red Hat
  updateStrategy:
    registryPoll:
      interval: 30m
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhoai-operator-dev
  namespace: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  channel: {{ .Values.rhoai.channel | quote }}
  installPlanApproval: Automatic
  name: rhods-operator
  source: {{ .Values.rhoai.catalogSource | quote }}
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cert-manager-operator
  namespace: cert-manager-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  channel: {{ .Values.operators.certManagerChannel | quote }}
  installPlanApproval: Automatic
  name: openshift-cert-manager-operator
  source: {{ .Values.operators.catalogSource | quote }}
  sourceNamespace: {{ .Values.operators.sourceNamespace | quote }}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: kuadrant-operator-group
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  channel: {{ .Values.operators.rhclChannel | quote }}
  installPlanApproval: Automatic
  name: rhcl-operator
  source: {{ .Values.operators.catalogSource | quote }}
  sourceNamespace: {{ .Values.operators.sourceNamespace | quote }}
---
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec: {}
