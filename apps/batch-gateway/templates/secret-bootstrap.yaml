apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch-gateway-secret-bootstrap
  namespace: batch-api
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: batch-gateway-secret-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: batch-gateway-secret-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: batch-gateway-secret-bootstrap
subjects:
  - kind: ServiceAccount
    name: batch-gateway-secret-bootstrap
    namespace: batch-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch-gateway-secret-bootstrap
  namespace: batch-api
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
data:
  bootstrap-secrets.sh: |
{{ .Files.Get "files/bootstrap-secrets.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-gateway-secret-bootstrap
  namespace: batch-api
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: batch-gateway-secret-bootstrap
      containers:
        - name: bootstrap
          image: {{ .Values.images.cli | quote }}
          command: ["/bin/bash", "/scripts/bootstrap-secrets.sh"]
          env:
            - name: MINIO_ACCESS_KEY
              value: {{ .Values.minio.accessKeyId | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: batch-gateway-secret-bootstrap
            defaultMode: 0550
