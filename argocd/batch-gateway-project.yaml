apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lwe-demo
  namespace: openshift-gitops
spec:
  description: Workloads managed by the LWE demo GitOps repository
  sourceRepos:
    - https://github.com/kylape/lwe-demo-gitops.git
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
