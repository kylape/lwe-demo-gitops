apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-platform
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/kylape/lwe-demo-gitops.git
    targetRevision: main
    path: apps/rhoai-platform
    helm:
      releaseName: rhoai-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ods-operator
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
